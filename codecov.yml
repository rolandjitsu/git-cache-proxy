# Codecov status gates. Patch coverage must be at least 90%, and project coverage
# allows 0.1% tolerance against the base to absorb minor dep or compiler jitter.
# ci.yml enforces a matching floor via fail-under-lines.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0.1%
    patch:
      default:
        target: 90%
