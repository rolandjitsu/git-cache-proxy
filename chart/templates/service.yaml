apiVersion: v1
kind: Service
metadata:
  name: '{{ include "git-cache-proxy.fullname" . }}'
  labels:
    app: '{{ include "git-cache-proxy.fullname" . }}'
spec:
  type: {{ .Values.service.type }}
  selector:
    app: '{{ include "git-cache-proxy.fullname" . }}'
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
